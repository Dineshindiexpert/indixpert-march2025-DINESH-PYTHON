<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gridboxes</title>
    <style>
        .rounded{border-radius: 5px;border: solid black;box-shadow: 1px 2px whitesmoke;}
        .main-container{display: grid; grid-template-columns: repeat(4,1fr);grid-template-rows:repeat(6,1fr) ;height: 500px;justify-content: center;align-content: center;margin: 100PX;aspect-ratio: 1/1;text-align: center;justify-content:center;gap: 2px;padding: 2px;}
         .box1{grid-column: 1/1;grid-row: 1/3;}
         .box2{grid-column: 2/4;grid-row: 1/1;}
         .box5{grid-column: 3/5;}
         .box7{grid-column: 2/4;}
         .box8{grid-column: 1/3;}
         .box10{grid-row: 3/5;grid-column: 4/4;}
         .box11{grid-column: 1/1;grid-row: 5/7;}
         .box12{grid-column: 2/4;}
         .box15{grid-column: 3/5;}
        

    </style>
</head>
<body>
    <main>
        <div class="main-container rounded">
            <div class="box1 rounded">box1</div>
            <div class="box2 rounded">box2</div>
            <div class="box3 rounded">box3</div>
            <div class="box4 rounded">box4</div>
            <div class="box5 rounded">box5</div>
            <div class="box6 rounded">box6</div>
            <div class="box7 rounded">box7</div>
            <div class="box8 rounded">box8</div>
            <div class="box9 rounded">box9</div>
            <div class="box10 rounded">box10</div>
            <div class="box11 rounded">box11</div>
            <div class="box12 rounded">box12</div>
            <div class="box13 rounded">box13</div>
            <div class="box14 rounded ">box14</div>
            <div class="box15 rounded">box15</div>
        </div>
    </main>
</body>
</html>
