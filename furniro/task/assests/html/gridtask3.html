<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>gridtask3</title>
    <style>
        .rounded {
            border-radius: 5px;
            border: 5px solid gray;
            box-shadow: 1px 2px gray;
        }

        .d-flex {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            background-color: beige;
            height: 75vh;
            width: 75%;
            align-items: center;
            justify-items: center;
            padding: px;
            margin: 25px;
        }

        .box {
            background-color: rgb(39, 79, 223);
            color: white;
            width: 100%;
            height: 100px;
            display: grid;
            place-items: center;
            font-weight: bold;
        }

        .box1 { grid-column: 1 / 6; grid-row: 1 / 2;}
        .box2 { grid-column: 1 / 3; grid-row: 2 / 2; }
        .box3 { grid-column: 3 / 6; grid-row: 3 / 2; }
        .box4 { grid-column: 3 / 6; grid-row: 3 / 3; }
    </style>
</head>
<body>
     <main>
        <div class="d-flex rounded">
            <div class="one box1 box rounded">one</div>
            <div class="two box2 box rounded">two</div>
            <div class="three box3 box rounded">three</div>
            <div class="four box4 box rounded">four</div>
        </div>
     </main>
</body>
</html>
