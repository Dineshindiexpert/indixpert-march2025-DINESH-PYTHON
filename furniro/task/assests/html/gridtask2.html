<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>grid-task-2</title>
  <style>
    .rounded {
      border-radius: 5px;
      border: 5px solid gray;
      box-shadow: 2px 5px;
      
    }

    .d-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      grid-template-rows: repeat(3, 1fr);    
      gap: 20px;
      background-color: rgb(170, 163, 163);
      height: 500px;
      padding: 30px;
      position: relative; 
      margin-top: 70px;
    }

    span {
      background-color: rgb(82, 134, 174);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .box1{
      grid-column: 1 / 4; 
      grid-row: 1 / 3;    
    }

    .box2 {
      grid-column: 2 / 5; 
      grid-row: 2 / 4;    
      background-color: rgba(4, 187, 237, 0.9);

      
      z-index: 1;
    }
  </style>
</head>
<body>
  <main>
    <div class="d-grid rounded">
      <span class="box1 rounded">Box 1</span>
      <span class="box2 rounded">Box 2</span>
    </div>
  </main>
</body>
</html>
