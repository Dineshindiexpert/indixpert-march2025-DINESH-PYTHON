<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>grid-task-1</title>
  <style>
    
    body{background :linear-gradient(rgb(32, 32, 46),hsl(240, 22%, 90%)) no-repeat;}
    body{min-height:100vh;font-family:Inter}
    body{justify-items: center;align-items: center;}
    .wrapper{width:100%;max-width:980px}

    
    .grid{
      display:grid; 
      grid-template-columns:repeat(3,1fr); 
      gap:20px; 
      align-items:start;
    }

    
    .item{
      margin-top: 200px;
      background:linear-gradient(180deg, #ffffff, #c83278);
      border:1px solid rgba(15,23,42,0.06);
      border-radius:12px;
      padding:18px;
      min-height:100px; 
      box-shadow:0 6px 18px rgba(16,24,40,0.04);
      display:flex;flex-direction:column;gap:8px;
    }

    .item h3{margin:0;font-size:16px;color:#0f172a}
  

    
     

    
     

  </style>
</head>
<body>
  <div class="wrapper">


    <div class="grid">
      <div class="item">
        <h3>Item 1</h3>
         
      </div>

      <div class="item">
        <h3>Item 2</h3>
         
      </div>

      <div class="item">
        <h3>Item 3</h3>
         
      </div>

      <div class="item">
        <h3>Item 4</h3>
         
      </div>
    </div>
  </div>
</body>
</html>
