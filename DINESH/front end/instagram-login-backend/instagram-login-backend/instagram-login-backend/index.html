<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Left Side (Login Form) -->
    <div class="login-box">
      <!-- Instagram Logo -->
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg" alt="Instagram Logo" width="150">
        <h1> <i>Instagram</i></h1>
      </div>

      <!-- Login Form -->
      <form class="login-form">
        <input type="text" placeholder="Phone number, username, or email" required>
        <br>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="login-button">Log In</button>
      </form>

      <!-- Forgot Password -->
      <div class="forgot-password">
        <a href="#">Forgot password?</a>
      </div>

      <!-- OR Divider -->
      <div class="or-divider">
        <span>OR</span>
      </div>

      <!-- Facebook Login -->
      <button class="facebook-login">Log in with Facebook</button>

      <!-- Sign Up -->
      <div class="signup">
        <p>Don't have an account? <a href="#">Sign up</a></p>
      </div>
    </div>
  </div>
</body>
</html>
